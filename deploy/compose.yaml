# ─────────────────────────────────────────────────────────────
#  compose.yaml — SignSpeak AI production stack (optional path)
#  Three services: gateway (Express :5000), ai-service (FastAPI
#  :8000), web (nginx serving the built frontend + proxy /api).
#  Mongo intentionally omitted — production uses Atlas. For local
#  compose testing, uncomment the mongodb service and set
#  MONGO_URI accordingly.
#
#  Usage:
#    cp .env.example .env   # then fill real secrets
#    docker compose up -d --build
# ─────────────────────────────────────────────────────────────────────────
name: signspeak

services:
  ai:
    build:
      context: ../backend/ai-service
      dockerfile: Dockerfile
    image: signspeak/ai:latest
    environment:
      - AI_HOST=0.0.0.0
      - AI_PORT=8000
      - AI_MODEL_DIR=models
      - TTS_ENGINE=tone
      - CORS_ORIGINS=${CLIENT_ORIGIN:-https://signspeak.example.com}
      - AI_MODEL_WINDOW=${AI_MODEL_WINDOW:-12}
      - AI_CONFIDENCE_THRESHOLD=${AI_CONFIDENCE_THRESHOLD:-0.55}
      - AI_SMOOTHING_ALPHA=${AI_SMOOTHING_ALPHA:-0.6}
    volumes:
      - ai_models:/app/models
    networks: [signspeak]
    restart: unless-stopped

  gateway:
    build:
      context: ../backend/gateway
    image: signspeak/gateway:latest
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=${MONGO_URI}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - ACCESS_TOKEN_TTL=15m
      - REFRESH_TOKEN_TTL_DAYS=7
      - VERIFY_TOKEN_TTL=1h
      - RESET_TOKEN_TTL=15m
      - REQUIRE_EMAIL_VERIFICATION=true
      - CLIENT_URL=${CLIENT_ORIGIN:-https://signalspeak.example.com}
      - AI_SERVICE_URL=http://ai:8000
      - AI_TIMEOUT_MS=8000
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=587
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    depends_on:
      ai:
        condition: service_healthy
    networks: [signspeak]
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/nginx/Dockerfile.web
    image: signspeak/web:latest
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      gateway:
        condition: service_started
    networks: [signspeak]
    restart: unless-stopped

#  mongo:                                  # optional local copy — OFF by default
#    image: mongo:8
#    volumes: [mongo_data:/data/db]
#    networks: [signspeak]

volumes:
  ai_models:
  mongo_data:

networks:
  signspeak: