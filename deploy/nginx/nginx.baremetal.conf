# ── SignSpeak AI · nginx site (bare-metal variant) ─────────────
# Same as deploy/nginx/nginx.conf but the API proxy targets the
# PM2 gateway on 127.0.0.1 instead of the compose service name.
# Copied to /etc/nginx/sites-available/signspeak by deploy.sh.
server {
  listen 80;
  server_name SERVER_NAME_PLACEHOLDER;

  root /opt/signspeak/dist;
  index index.html;

  # Security headers (the gateway also runs helmet on /api)
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(self), microphone=(self)";

  location /api/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location /realtime {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host       $host;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}