# ── SignSpeak AI · nginx (frontend static + API reverse proxy) ──
# One server block: serves the built SPA, proxies /api → gateway.
# The gateway (not nginx) is the only thing that talks to FastAPI.
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
  access_log  /var/log/nginx/access.log  main;

  sendfile        on;
  keepalive_timeout  65;

  # ── gzip: everything textual goes through, hashed assets beside ──
  gzip              on;
  gzip_min_length   1024;
  gzip_types        text/plain text/css application/json application/javascript
                    image/svg+xml application/xml font/woff2;
  gzip_vary         on;

  server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ── Security headers (belt: the gateway also runs helmet on /api) ──
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(self)";

    # ── API reverse proxy ──
    location /api/ {
      proxy_pass http://gateway:5000;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    # ── Future: WebSocket realtime (same-origin, no extra CORS) ──
    location /realtime {
      proxy_pass http://gateway:5000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host       $host;
    }

    # ── SPA + hashed assets: hashed = cache forever, html = never ──
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache";
    }
  }
}