<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SignSpeak AI — Real-time sign language translation through computer vision and deep learning. Breaking communication barriers through AI." />
    <meta name="theme-color" content="#0B0F19" />
    <title>SignSpeak AI — Breaking Communication Barriers Through AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      window.__bootErrors = [];
      window.addEventListener('error', e => window.__bootErrors.push((e.message || '?') + ' @ ' + e.filename + ':' + e.lineno + ' | ' + (e.error && e.error.stack || '')));
      window.addEventListener('unhandledrejection', e => window.__bootErrors.push('REJ: ' + String(e.reason)));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
